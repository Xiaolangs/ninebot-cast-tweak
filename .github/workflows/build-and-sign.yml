name: Build & Sign IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: '可选：IPA 直链；留空则从本仓库私有 Release 下载 Ninebot.ipa'
        required: false
        default: ''

permissions:
  contents: read        # 仅需读取私有 Release 里的 IPA

jobs:
  build-and-sign:
    name: Build dylib → inject → sign IPA
    runs-on: macos-14
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      # ── 1. 构建 dylib ─────────────────────────────────────────────
      - name: Setup Theos
        run: |
          set -euo pipefail
          if [ ! -f "$THEOS/makefiles/common.mk" ] || [ ! -f "$THEOS/bin/logos.pl" ]; then
            rm -rf "$THEOS"
            git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          fi

      - name: Build ProjectionOverride.dylib
        working-directory: tweak-theos
        run: |
          set -euo pipefail
          make
          DYLIB=$(find .theos -name 'ProjectionOverride.dylib' | head -1)
          test -n "$DYLIB"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$DYLIB" "$GITHUB_WORKSPACE/out/ProjectionOverride.dylib"
          nm -gU "$GITHUB_WORKSPACE/out/ProjectionOverride.dylib" | grep -q _MSHookMessageEx

      # ── 2. 取 IPA ─────────────────────────────────────────────────
      - name: Obtain IPA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sign"
          if [ -n "${{ inputs.ipa_url }}" ]; then
            echo "从 URL 下载"
            curl -fL --retry 3 -o "$RUNNER_TEMP/Ninebot.ipa" "${{ inputs.ipa_url }}"
          else
            echo "从私有 Release 下载 Ninebot.ipa"
            gh release download --pattern 'Ninebot.ipa' \
               --dir "$RUNNER_TEMP" --clobber \
               -R "${{ github.repository }}"
          fi
          ls -la "$RUNNER_TEMP/Ninebot.ipa"
          unzip -l "$RUNNER_TEMP/Ninebot.ipa" | head -5

      # ── 3. 导入证书 ───────────────────────────────────────────────
      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail
          KC=build.keychain
          KCPW=$(openssl rand -hex 16)
          security create-keychain -p "$KCPW" $KC
          security default-keychain -s $KC
          security unlock-keychain -p "$KCPW" $KC
          security set-keychain-settings -lut 21600 $KC
          printf '%s' "$P12_BASE64" | openssl base64 -d -A -out "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k $KC -P "$P12_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" $KC >/dev/null
          security find-identity -v -p codesigning $KC

      # ── 4. 描述文件 → entitlements，并自动推导 bundle id ──────────
      - name: Prepare profile & entitlements
        env:
          PROFILE_BASE64: ${{ secrets.PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP"
          printf '%s' "$PROFILE_BASE64" | openssl base64 -d -A -out "$W/profile.mobileprovision"
          security cms -D -i "$W/profile.mobileprovision" > "$W/profile.plist"
          plutil -extract Entitlements xml1 -o "$W/ent.plist" "$W/profile.plist"

          APPID=$(plutil -extract Entitlements.application-identifier raw "$W/profile.plist")
          TEAM=$(plutil -extract TeamIdentifier.0 raw "$W/profile.plist")
          echo "application-identifier = $APPID"
          echo "team                    = $TEAM"
          # 设备列表（ad-hoc 必须包含目标机 UDID）
          plutil -extract ProvisionedDevices json -o - "$W/profile.plist" 2>/dev/null || echo "(无设备列表)"

          if [[ "$APPID" == *"*"* ]]; then
            echo "PROFILE_WILDCARD=1" >> $GITHUB_ENV
            echo "通配描述文件：保留原 bundle id"
          else
            BID="${APPID#*.}"
            echo "NEW_BUNDLE_ID=$BID" >> $GITHUB_ENV
            echo "非通配：bundle id 必须改为 $BID"
          fi

          ID=$(security find-identity -v -p codesigning build.keychain \
                | grep -oE '"[^"]+"' | head -1 | tr -d '"')
          echo "SIGN_ID=$ID" >> $GITHUB_ENV
          echo "签名身份: $ID"

      # ── 5. 注入 + 重签 ───────────────────────────────────────────
      - name: Inject & re-sign
        env:
          PROFILE_PATH: ${{ runner.temp }}/profile.mobileprovision
          ENT_PLIST: ${{ runner.temp }}/ent.plist
          WORK_DIR: ${{ runner.temp }}/sign
        run: |
          set -euo pipefail
          pip3 install --quiet 'lief==0.15.1'
          export NEW_BUNDLE_ID="${NEW_BUNDLE_ID:-cn.ninebot.segway}"
          bash scripts/sign-ipa.sh \
            "$RUNNER_TEMP/Ninebot.ipa" \
            "$GITHUB_WORKSPACE/out/ProjectionOverride.dylib" \
            "$GITHUB_WORKSPACE/out/Ninebot_ProjectionOverride.ipa"

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: Ninebot-signed
          path: out/Ninebot_ProjectionOverride.ipa
          if-no-files-found: error
          compression-level: 0
